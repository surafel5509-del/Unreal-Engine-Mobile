# Nova Engine Gradle properties.
# JVM heap for the Gradle daemon (AGP + Kotlin + CMake configuration).
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX is required by AGP even when the app itself has no AndroidX
# dependencies (the editor module in milestone M9 uses Jetpack Compose).
android.useAndroidX=true
android.nonTransitiveRClass=true

# ---------------------------------------------------------------------------
# Nova Engine build knobs (consumed by app/build.gradle.kts)
# ---------------------------------------------------------------------------
# Package both ARM ABIs: some ARM64 processors run a 32-bit Android OS.
# Installation support is separate from the Vulkan 1.3 runtime requirement.
nova.abiFilters=arm64-v8a,armeabi-v7a

# Enable the Vulkan validation layer in debug builds when the device ships
# VK_LAYER_KHRONOS_validation (Play-store builds ignore this; it is a debug
# convenience flag, see docs/ARCHITECTURE.md).
nova.validation=true

# Shader compilation: "auto" uses glslangValidator/glslc from PATH (or from
# the path given by nova.glslang) when available and otherwise keeps the
# checked-in .spv files. "on" fails the build when no compiler is found.
# "off" always uses the checked-in .spv files.
nova.compileShaders=auto
#nova.glslang=/path/to/glslangValidator
