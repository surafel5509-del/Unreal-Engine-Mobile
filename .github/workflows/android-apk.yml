name: android-apk

# Builds the runnable demo APK with the real Android toolchain — the path the
# host workflows cannot cover: JDK 17, AGP 8.5.2, Gradle 8.7 (wrapper),
# NDK 26.3.11579264 and CMake 3.22.1 compiling the C++20 engine for arm64-v8a,
# Kotlin sources, JNI bridge, manifest and the checked-in SPIR-V assets.
#
# The resulting APK is uploaded as a build artifact and can be installed with:
#   adb install -r nova-engine-debug.apk
#
# Shader compilation is intentionally left on "auto" (gradle.properties): no
# glslangValidator exists on the runner, so the task skips itself and the APK
# ships the committed .spv files — exactly what a plain checkout does.

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

# The apk-latest release is republished by every green run so there is always a
# direct, phone-friendly .apk download link (artifacts download as .zip).
permissions:
  contents: write

jobs:
  apk:
    name: Assemble debug APK (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          # third_party/glm and third_party/vulkan-headers are submodules and
          # are required by the native CMake build.
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts', 'gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install Android SDK packages (NDK r26, CMake 3.22.1, platform 34)
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ]; then
            echo "ANDROID_HOME/ANDROID_SDK_ROOT not set on this runner" >&2
            exit 1
          fi
          echo "Android SDK: $SDK"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK/cmdline-tools" >&2
            find "$SDK" -maxdepth 2 -type d | head -30
            exit 1
          fi
          # Licenses are pre-accepted on the GitHub image; tolerate failure.
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.3.11579264" \
            "cmake;3.22.1"
          "$SDKMANAGER" --list_installed 2>/dev/null | head -20 || true
          test -d "$SDK/ndk/26.3.11579264" || { echo "NDK 26.3.11579264 missing" >&2; exit 1; }
          test -d "$SDK/cmake/3.22.1" || { echo "CMake 3.22.1 missing" >&2; exit 1; }

      - name: Gradle wrapper sanity check
        run: ./gradlew --version --no-daemon

      - name: Assemble debug APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle-build.log

      - name: Surface build errors
        # Runner logs are only visible in the web UI, so re-publish the first
        # Gradle/Kotlin/CMake diagnostics as check annotations (visible on the
        # run summary, in `gh run view` and via the check-runs API).
        if: failure()
        run: |
          if [ -f gradle-build.log ]; then
            grep -nE "error:|FAILURE:|What went wrong|Execution failed|Caused by:|CMake Error|FAILED" gradle-build.log \
              | head -60 \
              | cut -c1-800 \
              | while IFS= read -r line; do
                  echo "::error title=assembleDebug::${line}"
                done
          fi

      - name: Inspect the APK
        run: |
          set -euo pipefail
          ls -l app/build/outputs/apk/debug/
          APK="$(find app/build/outputs/apk/debug -name '*.apk' | head -1)"
          echo "APK: $APK ($(du -h "$APK" | cut -f1))"
          # The native engine library and the SPIR-V assets must be packaged,
          # otherwise the app would install and fail at load time.
          unzip -l "$APK" | grep -E "lib/arm64-v8a/libnova\.so" || { echo "libnova.so missing from the APK" >&2; exit 1; }
          unzip -l "$APK" | grep -E "assets/shaders/.*\.spv" || { echo "compiled shaders missing from the APK" >&2; exit 1; }
          unzip -l "$APK" | grep -E "classes\.dex" || { echo "no dex in the APK" >&2; exit 1; }
          echo "apk_path=$APK" >> "$GITHUB_ENV"

      - name: Verify signature, alignment and badging
        # A phone reports "There was a problem parsing the package." for an
        # unsigned APK, a truncated download, a zip renamed to .apk, or a device
        # older than minSdk. Prove none of the build-side causes apply and
        # publish the proof as check annotations plus a job summary, because
        # runner logs are not reachable from every environment.
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          BT="$SDK/build-tools/34.0.0"
          APK="${{ env.apk_path }}"
          {
            echo "## APK verification (apksigner / zipalign / aapt)"
            echo '```'
            "$BT/apksigner" verify --verbose --print-certs "$APK"
            if "$BT/zipalign" -c 4 "$APK"; then
              echo "zipalign -c 4: OK (4-byte aligned)"
            else
              echo "zipalign -c 4: FAILED"
              exit 1
            fi
            "$BT/aapt" dump badging "$APK" \
              | grep -E "^package:|sdkVersion:|targetSdkVersion:|native-code:|application-label:"
            echo '```'
          } | tee apk-verify.log >> "$GITHUB_STEP_SUMMARY"
          grep -E "Verifies|Verified using|zipalign|sdkVersion:|targetSdkVersion:|native-code:|^package:" apk-verify.log \
            | cut -c1-400 \
            | while IFS= read -r line; do echo "::notice title=apk-verify::${line}"; done
          # Stable name for the artifact and the release asset.
          mkdir -p dist
          cp "$APK" dist/nova-engine-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-engine-debug-apk
          path: dist/nova-engine-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish apk-latest release (direct .apk download)
        # GitHub artifacts always download as a .zip; installing that zip (or a
        # renamed copy of it) is the classic cause of the parse-error dialog on
        # the device. A release asset downloads as the bare APK, so every green
        # run republishes one stable URL that works from a phone browser.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest \
            --target "$GITHUB_SHA" \
            --title "Nova Engine debug APK (latest)" \
            --notes "Republished automatically by every successful android-apk run. arm64-v8a, minSdk 31 (Android 12 or newer). Install with: adb install -r nova-engine-debug.apk" \
            --prerelease \
            dist/nova-engine-debug.apk
          echo "Direct download: https://github.com/${GITHUB_REPOSITORY}/releases/download/apk-latest/nova-engine-debug.apk" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload native build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-logs
          path: |
            app/.cxx/**/*.txt
            app/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
