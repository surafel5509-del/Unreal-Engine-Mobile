name: android-apk

# Builds the runnable demo APK with the real Android toolchain — the path the
# host workflows cannot cover: JDK 17, AGP 8.5.2, Gradle 8.7 (wrapper),
# NDK 26.3.11579264 and CMake 3.22.1 compiling the C++20 engine for arm64-v8a + armeabi-v7a,
# Kotlin sources, JNI bridge, manifest and the checked-in SPIR-V assets.
#
# The resulting APK is uploaded as a build artifact and can be installed with:
#   adb install -r nova-engine-debug.apk
#
# Shader compilation is intentionally left on "auto" (gradle.properties): no
# glslangValidator exists on the runner, so the task skips itself and the APK
# ships the committed .spv files — exactly what a plain checkout does.

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

# The apk-latest release is republished by every green run so there is always a
# direct, phone-friendly .apk download link (artifacts download as .zip).
permissions:
  contents: write

jobs:
  apk:
    name: Assemble GLES editor APK (ARM + x86)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          # third_party/glm and third_party/vulkan-headers are submodules and
          # are required by the native CMake build.
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts', 'gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install Android SDK packages (NDK r26, CMake 3.22.1, platform 34)
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ]; then
            echo "ANDROID_HOME/ANDROID_SDK_ROOT not set on this runner" >&2
            exit 1
          fi
          echo "Android SDK: $SDK"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK/cmdline-tools" >&2
            find "$SDK" -maxdepth 2 -type d | head -30
            exit 1
          fi
          # Licenses are pre-accepted on the GitHub image; tolerate failure.
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.3.11579264" \
            "cmake;3.22.1"
          "$SDKMANAGER" --list_installed 2>/dev/null | head -20 || true
          test -d "$SDK/ndk/26.3.11579264" || { echo "NDK 26.3.11579264 missing" >&2; exit 1; }
          test -d "$SDK/cmake/3.22.1" || { echo "CMake 3.22.1 missing" >&2; exit 1; }

      - name: Gradle wrapper sanity check
        run: ./gradlew --version --no-daemon

      - name: Assemble debug APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace 2>&1 | tee gradle-build.log

      - name: Check Android API compatibility
        run: ./gradlew :app:lintDebug --no-daemon --stacktrace

      - name: Surface build errors
        # Runner logs are only visible in the web UI, so re-publish the first
        # Gradle/Kotlin/CMake diagnostics as check annotations (visible on the
        # run summary, in `gh run view` and via the check-runs API).
        if: failure()
        run: |
          if [ -f gradle-build.log ]; then
            grep -nE "error:|FAILURE:|What went wrong|Execution failed|Caused by:|CMake Error|FAILED|e: file:" gradle-build.log \
              | head -60 \
              | cut -c1-800 \
              | while IFS= read -r line; do
                  echo "::error title=assembleDebug::${line}"
                done
          fi

      - name: Inspect the APK
        run: |
          set -euo pipefail
          ls -l app/build/outputs/apk/debug/
          APK="$(find app/build/outputs/apk/debug -name '*.apk' | head -1)"
          echo "APK: $APK ($(du -h "$APK" | cut -f1))"
          # The native engine library and the SPIR-V assets must be packaged,
          # otherwise the app would install and fail at load time.
          python3 -m unittest discover -s tools/tests -p 'test_apk_contents.py' -v
          python3 tools/verify_apk_contents.py "$APK"
          READELF="$ANDROID_HOME/ndk/26.3.11579264/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            unzip -p "$APK" "lib/$abi/libnova.so" > "$RUNNER_TEMP/libnova-$abi.so"
            "$READELF" -d "$RUNNER_TEMP/libnova-$abi.so" > "$RUNNER_TEMP/deps-$abi.txt"
            if grep -q 'libvulkan.so' "$RUNNER_TEMP/deps-$abi.txt"; then
              echo "::error::Vulkan must not be a load-time dependency on Android 5"; exit 1
            fi
            grep -q 'libEGL.so' "$RUNNER_TEMP/deps-$abi.txt"
            grep -q 'libGLESv2.so' "$RUNNER_TEMP/deps-$abi.txt"
          done
          for shader in background.vert background.frag triangle.vert triangle.frag; do
            unzip -p "$APK" "assets/shaders/$shader.spv" > "$RUNNER_TEMP/$shader.spv"
            test -s "$RUNNER_TEMP/$shader.spv"
          done
          unzip -l "$APK" | grep -E "classes\.dex" || { echo "no dex in the APK" >&2; exit 1; }
          echo "apk_path=$APK" >> "$GITHUB_ENV"

      - name: Verify signature, alignment and badging
        # A phone reports "There was a problem parsing the package." for an
        # unsigned APK, a truncated download, a zip renamed to .apk, or a device
        # older than minSdk. Prove none of the build-side causes apply and
        # publish the proof as check annotations plus a job summary, because
        # runner logs are not reachable from every environment.
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          BT="$SDK/build-tools/34.0.0"
          APK="${{ env.apk_path }}"
          "$BT/aapt" dump badging "$APK" > apk-badging.log
          grep -Eq "^sdkVersion:[[:space:]]*'21'[[:space:]]*$" apk-badging.log || { echo "::error::APK must declare minSdk 21"; cat apk-badging.log; exit 1; }
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            grep '^native-code:' apk-badging.log | grep -F "'$abi'" || { echo "::error::Missing APK ABI $abi"; exit 1; }
          done
          {
            echo "## APK verification (apksigner / zipalign / aapt)"
            echo '```'
            "$BT/apksigner" verify --min-sdk-version 21 --verbose --print-certs "$APK"
            if "$BT/zipalign" -c 4 "$APK"; then
              echo "zipalign -c 4: OK (4-byte aligned)"
            else
              echo "zipalign -c 4: FAILED"
              exit 1
            fi
            "$BT/aapt" dump badging "$APK" \
              | grep -E "^package:|sdkVersion:|targetSdkVersion:|native-code:|application-label:"
            echo '```'
          } | tee apk-verify.log >> "$GITHUB_STEP_SUMMARY"
          grep -E "Verifies|Verified using|zipalign|sdkVersion:|targetSdkVersion:|native-code:|^package:" apk-verify.log \
            | cut -c1-400 \
            | while IFS= read -r line; do echo "::notice title=apk-verify::${line}"; done
          # Stable name for the artifact and the release asset.
          mkdir -p dist
          cp "$APK" dist/nova-engine-debug.apk
          (cd dist && sha256sum nova-engine-debug.apk > nova-engine-debug.apk.sha256)
          cat dist/nova-engine-debug.apk.sha256 >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-engine-debug-apk
          path: |
            dist/nova-engine-debug.apk
            dist/nova-engine-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload instrumentation test APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-editor-tests
          path: app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error

      - name: Upload native build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-logs
          path: |
            gradle-build.log
            apk-verify.log
            apk-badging.log
            app/build/reports/lint-results-debug.*
            app/.cxx/**/*.txt
            app/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7

  smoke:
    name: Device test (API ${{ matrix.api }}, ${{ matrix.arch }})
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 21
            arch: x86
          - api: 26
            arch: x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: nova-engine-debug-apk
          path: apks
      - uses: actions/download-artifact@v4
        with:
          name: nova-editor-tests
          path: apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and exercise GLES editor
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: ${{ matrix.arch }}
          target: default
          profile: Nexus 5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash tools/android_smoke_test.sh
      - name: Report test result
        if: always()
        run: |
          if [ -f device-test.log ]; then
            tail -60 device-test.log >> "$GITHUB_STEP_SUMMARY"
            if ! grep -q 'OK (1 test)' device-test.log; then
              tail -30 device-test.log | while IFS= read -r line; do echo "::error title=Device test::${line}"; done
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-api-${{ matrix.api }}
          path: |
            device-test.log
            device-logcat.log
            editor-screenshot.png

  publish:
    name: Publish tested APK
    needs: [apk, smoke]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nova-engine-debug-apk
          path: dist
      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest --target "$GITHUB_SHA" \
            --title "Nova Studio 0.2.0 — GLES editor APK" \
            --notes "Commit: $GITHUB_SHA. Android 5+ (minSdk 21). ARM32/ARM64/x86/x86_64. OpenGL ES 2 on Android 5–7; ES 3 preferred on Android 8+ with ES 2 fallback. No Vulkan requirement. Scene editor foundation, not a complete Unity replacement. Debug-signed. Emulator integration tests passed on API 21 and 26." \
            --prerelease dist/nova-engine-debug.apk dist/nova-engine-debug.apk.sha256
          echo "Download: https://github.com/${GITHUB_REPOSITORY}/releases/download/apk-latest/nova-engine-debug.apk" >> "$GITHUB_STEP_SUMMARY"
